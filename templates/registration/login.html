{% extends "learning/layout.html" %} {% load static %}

{% block content %}
<div class="auth-container">
    <div class="login-box">
        <div class="auth-header">
            <div class="auth-emoji">👋</div>
            <h2>Chào mừng trở lại!</h2>
            <p>Hôm nay bạn muốn nâng cấp kỹ năng tiếng Anh nào?</p>
        </div>
        
        <form method="post" class="styled-form">
            {% csrf_token %}
            <div class="form-fields-wrapper">
                {{ form.as_p }}
            </div>
            <button type="submit" class="btn btn-auth-submit">Đăng nhập ngay</button>
        </form>

        <div class="auth-footer">
            <p>Chưa có tài khoản? <a href="{% url 'learning:signup' %}" class="auth-link">Tạo tài khoản mới</a></p>
        </div>
    </div>
</div>
{% endblock %}
